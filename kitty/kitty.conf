# kitty in the main-theme palette (black, Nagash teal, #29a99e accent)

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

window_padding_width 6
# Termux login shell (~/.termux/shell); $SHELL is bash there
shell /data/data/com.termux/files/usr/bin/fish --login
confirm_os_window_close 0
enable_audio_bell no
visual_bell_duration 0
cursor_shape beam
cursor_blink_interval 0
scrollback_lines 5000
copy_on_select clipboard
strip_trailing_spaces smart
# Termux:X11: no system font scaling tricks needed, keep rendering simple
sync_to_monitor yes

# Colours
background            #000000
foreground            #ebedf0
cursor                #29a99e
cursor_text_color     #000000
selection_background  #155852
selection_foreground  #ebedf0
url_color             #29a99e
active_border_color   #238f86
inactive_border_color #202124
active_tab_background   #155852
active_tab_foreground   #ebedf0
inactive_tab_background #202124
inactive_tab_foreground #8b8e94
tab_bar_background      #000000

