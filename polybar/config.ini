; polybar for the i3 desktop — stands in for waybar, in the main-theme
; palette (same tokens as hyprlock.conf / waybar style.css).

[colors]
bg = #000000
bg-weak = #0f0f0f
card = #202124
primary-hi = #155852
accent = #29a99e
border = #238f86
text = #ebedf0
muted = #8b8e94
danger = #f7768e
warn = #e0af68

[bar/main]
width = 100%
height = 30
bottom = false
fixed-center = true
background = ${colors.bg}
foreground = ${colors.text}
line-size = 2
padding-left = 0
padding-right = 2
module-margin = 1
separator = " "
separator-foreground = ${colors.card}

font-0 = NotoSans Nerd Font:size=10;3
font-1 = NotoSans Nerd Font:style=SemiBold:size=10;3
font-2 = JetBrainsMono Nerd Font:size=11;3

modules-left = i3
modules-center = date
modules-right = pulseaudio memory battery

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true
wm-restack = i3
override-redirect = false

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
index-sort = true
enable-click = true
enable-scroll = true
wrapping-scroll = false
strip-wsnumbers = true

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${colors.warn}
label-mode-foreground = ${colors.bg}

label-focused = %name%
label-focused-padding = 2
label-focused-background = ${colors.primary-hi}
label-focused-underline = ${colors.accent}
label-focused-font = 2

label-unfocused = %name%
label-unfocused-padding = 2
label-unfocused-foreground = ${colors.muted}

label-visible = %name%
label-visible-padding = 2
label-visible-foreground = ${colors.text}

label-urgent = %name%
label-urgent-padding = 2
label-urgent-background = ${colors.danger}
label-urgent-foreground = ${colors.bg}

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-font = 2
label-foreground = ${colors.text}

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
click-right = pavucontrol &
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.accent}
ramp-volume-font = 3
label-muted = 󰝟 muted
label-muted-foreground = ${colors.muted}

; No cpu module: Android blocks /proc/stat for apps

[module/memory]
type = internal/memory
interval = 5
format-prefix = "󰍛 "
format-prefix-foreground = ${colors.accent}
format-prefix-font = 3
label = %percentage_used%%

; /sys/class/power_supply isn't readable on Android: ask Termux:API instead
[module/battery]
type = custom/script
exec = ~/.config/i3/polybar/battery.sh
interval = 60
format = <label>
label = %output%
