# picom for the i3 desktop — mirrors decoration{} in hyprland.lua:
# rounding 4, a small dark shadow, no animations, blur only behind the
# launcher (Hypr blurs only the vicinae layer).

backend = "xrender";   # see scripts/picom.sh for why not glx
vsync = false;
use-damage = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;

# decoration.rounding = 4
corner-radius = 4;

# decoration.shadow: range 4, color rgba(1a1a1aee)
shadow = true;
shadow-radius = 4;
shadow-offset-x = -4;
shadow-offset-y = -4;
shadow-opacity = 0.93;
shadow-color = "#1a1a1a";

# animations.enabled = false
fading = false;

# decoration.blur: size 6, passes 3. dual_kawase needs the GL backend, so
# xrender gets a gaussian kernel of similar strength.
blur-method = "gaussian";
blur-size = 13;
blur-deviation = 6;
blur-background = false;
blur-background-frame = false;
blur-background-fixed = false;

# active/inactive_opacity = 1.0 is picom's default (and the old-style
# *-opacity options would be ignored next to "rules" anyway)

rules: (
  # Glass only behind the launcher
  { match = "class_g = 'Rofi'"; blur-background = true; corner-radius = 14; },

  # Bar, notifications and tooltips: no shadow; the bar keeps square corners
  { match = "window_type = 'dock' || class_g = 'Polybar'"; shadow = false; corner-radius = 0; },
  { match = "class_g = 'Dunst'"; shadow = false; corner-radius = 8; },
  { match = "window_type = 'tooltip' || window_type = 'menu' || "
            "window_type = 'dropdown_menu' || window_type = 'popup_menu'"; shadow = false; },

  # Fullscreen windows: no corners, no shadow
  { match = "fullscreen"; corner-radius = 0; shadow = false; },
)
